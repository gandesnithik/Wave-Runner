<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wave Runner</title>
<meta name="theme-color" content="#05030c">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;height:100dvh}
body{height:100%;margin:0;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;background:#05030c;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
</style></head><body><canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),H=600,F='Orbitron, system-ui, sans-serif';
let W=1000,S=1;
let vg=document.createElement('canvas'),oy=0,VH=600,tk=1,touch=matchMedia('(pointer:coarse)').matches;
function rs(){const r=Math.min(devicePixelRatio||1,1.5);cv.width=cv.clientWidth*r;cv.height=cv.clientHeight*r;S=Math.min(cv.height/H,cv.width/720);W=cv.width/S;VH=cv.height/S;oy=(VH-H)/2;tk=Math.min(1.8,Math.max(1,.85*r/S));
  vg.width=cv.width;vg.height=cv.height;const v=vg.getContext('2d'),q=v.createRadialGradient(vg.width/2,vg.height/2,vg.height*.45,vg.width/2,vg.height/2,Math.max(vg.width,vg.height)*.7);q.addColorStop(0,'rgba(0,0,0,0)');q.addColorStop(1,'rgba(0,0,0,.6)');v.fillStyle=q;v.fillRect(0,0,vg.width,vg.height)}
addEventListener('resize',rs);rs();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function mb(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ck=()=>{const m=document.cookie.match(/(?:^|; )wrhi=(\d+)/);return m?+m[1]:0};
function ld(){let a=0,b=0;try{a=+localStorage.getItem('wrhi')||0}catch(e){}try{b=ck()}catch(e){}return Math.max(a,b)}
function sv(){try{localStorage.setItem('wrhi',hi)}catch(e){}try{document.cookie='wrhi='+hi+';max-age=31536000;path=/;SameSite=Lax'}catch(e){}}
let hi=ld(),best0=0,lsv=0;
let lastDir=1,st='menu',rng,pts,spk,gts,w,tr,parts,hold=false,score=0,deadT=0,shake=0,flash=0,isNew=false,demo=true,msg='',msgT=0,nextMs=500,time=0;
const P=d=>({gap:Math.max(115,270-155*d),a:Math.max(200,500-300*d),b:Math.max(320,780-460*d),spd:Math.min(540,320+220*d),gh:Math.max(95,145-50*d)});
const dif=x=>demo?.25:Math.min(1,.12+x/40000);
function gen(){
  const l=pts[pts.length-1],d=dif(l.x),p=P(d),safe=demo||l.x<1500;
  let len=p.a+rng()*(p.b-p.a),gate=false,tun=false,dir;
  if(!safe&&rng()<.14+.16*d&&(!gts.length||l.x-gts[gts.length-1].x>1500)){gate=true;len=700;dir=0}
  else{tun=!safe&&rng()<.08+.12*d;if(tun)len=Math.max(len,480);dir=rng()<(1-d)*.2?0:(rng()<.6?-(lastDir||1):(rng()<.5?-1:1))}
  const gt=tun?Math.max(115,p.gap*.8):p.gap*(.85+rng()*.3),g0=gate?Math.max(gt,190):gt,g=l.g+clamp(g0-l.g,-.3*len,.3*len);
  const lo=g/2+25,hi2=H-g/2-25;let c=l.c+dir*len;
  if(c<lo||c>hi2){dir=-dir;c=l.c+dir*len}
  c=clamp(c,lo,hi2);if(dir)lastDir=dir;pts.push({x:l.x+len,c,g});
  if(gate)gts.push({x:l.x+len*.9,c,gh:p.gh});
  else if(!safe&&!tun&&rng()<.3+.3*d){const n=1+(rng()*(1+2*d)|0);for(let i=0;i<n;i++){const t=.1+.8*rng(),gx=l.g+(g-l.g)*t;if(gx>=145)spk.push({x:l.x+len*t,top:rng()<.5,h:Math.min(24,gx-115)*(.7+.3*rng())})}}
}
function at(x){let a=0,b=pts.length-1;while(b-a>1){const m=(a+b)>>1;pts[m].x<=x?a=m:b=m}
  const p=pts[a],q=pts[b],t=clamp((x-p.x)/(q.x-p.x),0,1);return[p.c+(q.c-p.c)*t,p.g+(q.g-p.g)*t]}
function init(isDemo){demo=isDemo;rng=mb(Date.now()&0xffffff);pts=[{x:-500,c:300,g:420},{x:500,c:300,g:300}];spk=[];gts=[];
  while(pts[pts.length-1].x<3000)gen();
  w={x:0,y:300,up:false,spd:330};tr=[{x:0,y:300}];parts=[];score=0;nextMs=500;msgT=0}
function startGame(){init(false);best0=hi;lsv=hi;st='play';document.fonts&&document.fonts.load('700 20px Orbitron')}
function boom(n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=60+Math.random()*420;parts.push({x:w.x,y:w.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,z:2+Math.random()*3})}}
function die(){st='dead';deadT=performance.now();shake=22;flash=1;boom(110);
  isNew=score>best0;if(score>hi)hi=score;sv()}
function press(){
  if(st==='menu')return startGame();
  if(st==='dead'){if(performance.now()-deadT>350)startGame();return}
  hold=true}
cv.addEventListener('pointerdown',press);cv.addEventListener('contextmenu',e=>e.preventDefault());addEventListener('pagehide',sv);document.addEventListener('visibilitychange',()=>{if(document.hidden)sv()});
addEventListener('pointerup',()=>hold=false);addEventListener('pointercancel',()=>hold=false);
addEventListener('keydown',e=>{if(e.repeat)return;if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();press()}});
addEventListener('keyup',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code))hold=false});
function upd(dt){
  time+=dt;shake*=Math.pow(.02,dt);flash=Math.max(0,flash-dt*2.5);msgT=Math.max(0,msgT-dt);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt*(p.s?1.6:1.1)}parts=parts.filter(p=>p.l>0);if(parts.length>350)parts.splice(0,parts.length-350);
  if(st==='dead')return;
  const p=P(dif(w.x)),h=demo?w.y>at(w.x)[0]:hold;
  w.spd+=((demo?300:p.spd)-w.spd)*Math.min(1,dt*2);
  if(h!==w.up){w.up=h;tr.push({x:w.x,y:w.y})}
  w.x+=w.spd*dt;w.y+=(w.up?-1:1)*w.spd*dt;
  parts.push({x:w.x,y:w.y,vx:-w.spd*.3+(Math.random()-.5)*60,vy:(Math.random()-.5)*90,l:.7,z:1.5+Math.random()*1.5,s:1});
  while(pts[pts.length-1].x<w.x+W+1200)gen();
  while(pts.length>4&&pts[2].x<w.x-W)pts.shift();
  spk=spk.filter(k=>k.x>w.x-W-100);gts=gts.filter(k=>k.x>w.x-W-100);
  if(demo){if(w.x>40000)init(true);return}
  const[c,g]=at(w.x);let tp=c-g/2,bt=c+g/2;
  for(const k of spk){const dx=Math.abs(k.x-w.x);if(dx<14){const i=k.h*(1-dx/14);k.top?tp+=i:bt-=i}}
  if(w.y-5<tp||w.y+5>bt)return die();
  for(const k of gts)if(Math.abs(k.x-w.x)<22&&(w.y-5<k.c-k.gh/2||w.y+5>k.c+k.gh/2))return die();
  score=w.x/10|0;if(score>hi){hi=score;if(score-lsv>=15){lsv=score;sv()}}if(score>=nextMs){msg='SPEED UP';msgT=2;nextMs+=500}
}
function tx(s,x,y,sz,col,al,gl){ctx.font=`700 ${sz}px ${F}`;ctx.textAlign='center';ctx.globalAlpha=al==null?1:al;ctx.fillStyle=col;ctx.shadowColor=gl||col;ctx.shadowBlur=gl===0?0:sz/2.2;ctx.fillText(s,x,y);ctx.shadowBlur=0;ctx.globalAlpha=1}
function draw(){
  const hue=(205+w.x/45)%360,acc=`hsl(${hue},100%,62%)`,dng=`hsl(${(hue+165)%360},100%,60%)`,cx=w.x-W*.28;
  ctx.setTransform(S,0,0,S,0,0);
  let g=ctx.createLinearGradient(0,0,0,VH);g.addColorStop(0,`hsl(${hue+20},60%,8%)`);g.addColorStop(1,`hsl(${hue-20},70%,3%)`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,VH);
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<3;i++){const m=W+600,nx=((i*517-cx*.04*(i+1))%m+m)%m-300,ny=VH*(.2+i*.22);
    g=ctx.createRadialGradient(nx,ny,0,nx,ny,330);g.addColorStop(0,`hsla(${hue+i*45},90%,50%,.17)`);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(nx-330,ny-330,660,660)}
  for(let i=0;i<70;i++){const l=i%3,sx=((i*97.3-cx*(.08+l*.08))%W+W)%W;
    ctx.fillStyle=`rgba(255,255,255,${(.25+.2*l)*(.6+.4*Math.sin(time*2+i))})`;ctx.fillRect(sx,(i*53.7)%VH,1+l*.7,1+l*.7)}
  ctx.fillStyle=acc;ctx.globalAlpha=.07;
  for(let i=0;i<10;i++)ctx.fillRect(((i*211-cx*1.7)%W+W)%W,(i*61+13)%VH,140,1.2);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.setTransform(S,0,0,S,(Math.random()-.5)*shake*S,(oy+(Math.random()-.5)*shake)*S);
  const xs=[cx];for(const p of pts)if(p.x>cx&&p.x<cx+W)xs.push(p.x);xs.push(cx+W);
  const top=[],bot=[];for(const x of xs){const[c,gp]=at(x);top.push([x-cx,c-gp/2]);bot.push([x-cx,c+gp/2])}
  g=ctx.createLinearGradient(0,0,0,H*.5);g.addColorStop(0,`hsl(${hue},45%,3%)`);g.addColorStop(1,`hsl(${hue},55%,15%)`);ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(-5,-oy-9);for(const q of top)ctx.lineTo(q[0],q[1]);ctx.lineTo(W+5,-oy-9);ctx.fill();
  g=ctx.createLinearGradient(0,H*.5,0,H);g.addColorStop(0,`hsl(${hue},55%,15%)`);g.addColorStop(1,`hsl(${hue},45%,3%)`);ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(-5,H+oy+9);for(const q of bot)ctx.lineTo(q[0],q[1]);ctx.lineTo(W+5,H+oy+9);ctx.fill();
  ctx.lineJoin='round';
  for(const e of[top,bot]){const path=()=>{ctx.beginPath();e.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]))};
    path();ctx.strokeStyle=acc;ctx.globalAlpha=.22;ctx.lineWidth=14;ctx.stroke();ctx.globalAlpha=1;ctx.lineWidth=4;ctx.stroke();
    ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.3;path();ctx.stroke()}
  for(const t of gts){const x=t.x-cx;if(x<-40||x>W+40)continue;const a=t.c-t.gh/2,b=t.c+t.gh/2;
    ctx.fillStyle=`hsl(${hue},50%,9%)`;ctx.fillRect(x-17,-oy-9,34,a+oy+9);ctx.fillRect(x-17,b,34,H-b+oy+9);
    ctx.strokeStyle=dng;ctx.lineWidth=3;ctx.strokeRect(x-17,-oy-9,34,a+oy+9);ctx.strokeRect(x-17,b,34,H-b+oy+9);
    ctx.shadowBlur=0;ctx.fillStyle=dng;ctx.globalAlpha=.25;ctx.fillRect(x-17,a-6,34,6);ctx.fillRect(x-17,b,34,6);ctx.globalAlpha=1}
  ctx.fillStyle=dng;
  for(const k of spk){if(k.x<cx-40||k.x>cx+W+40)continue;const x0=k.x-14,x1=k.x+14,[c0,g0]=at(x0),[c1,g1]=at(x1),[c,gp]=at(k.x),s=k.top?1:-1;
    const y0=k.top?c0-g0/2:c0+g0/2,y1=k.top?c1-g1/2:c1+g1/2,yt=(k.top?c-gp/2:c+gp/2)+s*k.h;
    ctx.beginPath();ctx.moveTo(x0-cx,y0);ctx.lineTo(x1-cx,y1);ctx.lineTo(k.x-cx,yt);ctx.closePath();ctx.fill()}
  ctx.shadowBlur=0;
  while(tr.length>2&&tr[1].x<w.x-700)tr.shift();
  if(st!=='dead'){
    const hx=w.x-cx;g=ctx.createLinearGradient(hx-600,0,hx,0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,acc);
    ctx.strokeStyle=g;
    for(const[lw,al]of[[12,.18],[4,1]]){ctx.lineWidth=lw;ctx.globalAlpha=al;ctx.beginPath();tr.forEach((q,i)=>i?ctx.lineTo(q.x-cx,q.y):ctx.moveTo(q.x-cx,q.y));ctx.lineTo(hx,w.y);ctx.stroke()}
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='lighter';g=ctx.createRadialGradient(hx,w.y,0,hx,w.y,34);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(.25,acc);g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.fillRect(hx-34,w.y-34,68,68);ctx.globalCompositeOperation='source-over';
    ctx.save();ctx.translate(hx,w.y);ctx.rotate(w.up?-Math.PI/4:Math.PI/4);ctx.fillStyle='#fff';ctx.shadowColor=acc;ctx.shadowBlur=14;
    ctx.beginPath();ctx.moveTo(13,0);ctx.lineTo(-9,-8);ctx.lineTo(-5,0);ctx.lineTo(-9,8);ctx.fill();ctx.restore();ctx.shadowBlur=0}
  ctx.globalCompositeOperation='lighter';ctx.fillStyle=acc;
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.l);ctx.fillRect(p.x-cx-p.z/2,p.y-p.z/2,p.z,p.z)}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.setTransform(S,0,0,S,0,0);
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(vg,0,0);ctx.setTransform(S,0,0,S,0,0);
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.35})`;ctx.fillRect(0,0,W,VH)}
  if(st==='play'){
    tx('SCORE',W/2,24*tk,11*tk,'rgba(255,255,255,.6)',1,0);tx(score+' m',W/2,62*tk,38*tk,'#fff');
    tx('HIGH SCORE  '+hi+' m',W/2,88*tk,12*tk,acc,.9,0);
    if(msgT>0)tx(msg,W/2,oy+H*.2,26*tk,acc,Math.min(1,msgT))}
  if(st==='menu'||st==='dead'){ctx.fillStyle=`rgba(3,2,10,${st==='menu'?.55:.7})`;ctx.fillRect(0,0,W,VH);ctx.translate(W/2,oy+H/2);ctx.scale(tk,tk);ctx.translate(-W/2,-H/2);
    const pu=.55+.45*Math.sin(time*3);
    if(st==='menu'){
      tx('WAVE',W/2,H/2-70,Math.min(96,W/11),'#fff',1,acc);tx('RUNNER',W/2,H/2+10,Math.min(96,W/11),acc,1);
      tx('HOLD TO GO UP  ·  RELEASE TO GO DOWN',W/2,H/2+58,14,'rgba(255,255,255,.65)',1,0);
      tx('HIGH SCORE  '+hi+' m',W/2,H/2+100,18,'#ffd55a',1);
      tx((touch?'TAP TO START':'TAP OR PRESS SPACE TO START'),W/2,H/2+150,16,'#fff',pu)}
    else{
      tx('CRASHED',W/2,H/2-60,56,dng,1);tx('SCORE  '+score+' m',W/2,H/2-10,26,'#fff');
      tx('HIGH SCORE  '+hi+' m',W/2,H/2+30,20,'#ffd55a');
      if(isNew)tx('NEW HIGH SCORE!',W/2,H/2+66,16,'#ffd55a',pu);
      tx((touch?'TAP TO RETRY':'TAP OR PRESS SPACE TO RETRY'),W/2,H/2+116,15,'#fff',pu)}}
}
let last=performance.now();
function loop(t){upd(Math.min(.033,(t-last)/1000));last=t;draw();requestAnimationFrame(loop)}
init(true);requestAnimationFrame(loop);
</script></body></html>
